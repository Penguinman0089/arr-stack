# Camera Listen — AAC from the Reolink NVR, MP3 to the sofa panel, on demand.
#
#   docker compose -f docker-compose.camera-listen.yml up -d --build
#
# WHY IT LIVES HERE and not in the sofa-panel repo: it runs on the NAS, and NAS
# services deploy from this repo through the branch-first flow in CLAUDE.md.
# Keeping a second copy beside the panel would be a mirror maintained by
# memory, which is the failure this project has already had once.
#
# The panel's own repo (~/dev/sofa-panel-tab5) documents WHY it exists, in
# docs/camera-listen-service.md. This is the thing that runs.
#
# Config lives in camera-listen/.env — copy camera-listen/env.example. It holds
# the NVR password, so it is gitignored and never travels with the branch.

services:
  camera-listen:
    build: ./camera-listen
    image: camera-listen:latest
    container_name: camera-listen
    restart: unless-stopped
    env_file: ./camera-listen/.env
    ports:
      - "8083:8083"
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "3"}
